# Render.com deployment configuration
# Deploy FastAPI backend to Render

services:
  - type: web
    name: Stratix-AI-Backend
    runtime: python3
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    region: ohio
    
    envVars:
      - key: FRONTEND_URL
        value: https://your-frontend.netlify.app
      - key: GOOGLE_API_KEY
        value: your-google-api-key

